[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaotts"
version = "0.1.0"
description = "Experimental five-language TTS below one million learned inference parameters"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6,<2.8", "numpy>=1.26,<2", "scipy>=1.11,<2",
  "soundfile>=0.12,<0.14", "pyworld>=0.3.4,<0.4",
  "pypinyin>=0.53,<0.56", "jieba>=0.42,<0.43", "praatio>=6.2,<7",
  "requests>=2.32,<3", "onnx>=1.17,<2", "onnxruntime>=1.20,<2",
  "ml-dtypes>=0.5,<0.6"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
eval = ["faster-whisper==1.2.1", "jiwer>=4,<5", "opencc>=1.1.9,<2"]

[tool.setuptools.packages.find]
include = ["xiaotts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

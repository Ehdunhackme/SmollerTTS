[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smollertts"
version = "0.1.0"
description = "Compact English TTS with acoustic training and browser export"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<2.8", "numpy>=1.26,<3"]

[project.optional-dependencies]
train = ["librosa>=0.10.2,<0.12", "soundfile>=0.12,<0.14", "scipy>=1.11,<2", "pyworld>=0.3.4,<0.4"]
export = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2", "soundfile>=0.12,<0.14"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["smollertts*"]

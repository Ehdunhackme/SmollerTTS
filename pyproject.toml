[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smollertts"
version = "0.1.0"
description = "Compact English TTS architecture and acoustic training components"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<2.8", "numpy>=1.26,<3"]

[tool.setuptools.packages.find]
include = ["smollertts*"]
